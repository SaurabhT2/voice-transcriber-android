name: Android CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" SDK package is retired and makes sdkmanager fail.
          packages: "platform-tools"
      - name: Cache NDK and CMake
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk
            ${{ env.ANDROID_HOME }}/cmake
          key: android-native-${{ runner.os }}-ndk25.2.9519653-cmake3.22.1
      - name: Install Android SDK, NDK and CMake
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653" "cmake;3.22.1"
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
      - name: Lint
        run: ./gradlew lintDebug
        continue-on-error: true # advisory until the existing findings are triaged
      - name: Assemble debug APK
        run: ./gradlew assembleDebug
      - name: Verify native libraries are 16 KB aligned
        run: ./scripts/check-16kb-alignment.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meeting-workspace-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
